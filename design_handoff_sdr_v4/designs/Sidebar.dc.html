<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside style="width:228px; background:#1a1a1a; flex-shrink:0; display:flex; flex-direction:column; padding:18px 13px; height:100%;">
  <div style="display:flex; align-items:center; gap:10px; padding:4px 8px 18px;"><div style="width:32px; height:32px; border-radius:8px; background:#e50914; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:#fff;">V4</div><div style="font-size:13px; font-weight:700; color:#fff;">SDR de IA</div></div>

  <a href="{{ link }}" style="{{ styleInicio }}"><span style="{{ accentInicio }}"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ strokeInicio }}" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg><span style="font-size:13px; font-weight:600;">Início</span></a>
  <a href="{{ link }}" style="{{ styleConversas }}"><span style="{{ accentConversas }}"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ strokeConversas }}" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8A8.5 8.5 0 0 1 12.5 3 8.5 8.5 0 0 1 21 11.5z"/></svg><span style="font-size:13px; font-weight:600;">Conversas</span><span style="margin-left:auto; font-size:10px; font-weight:800; background:#e50914; color:#fff; border-radius:999px; padding:2px 7px;">4</span></a>
  <a href="{{ link }}" style="{{ styleLeads }}"><span style="{{ accentLeads }}"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ strokeLeads }}" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg><span style="font-size:13px; font-weight:600;">Leads</span></a>
  <a href="{{ link }}" style="{{ stylePlayground }}"><span style="{{ accentPlayground }}"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ strokePlayground }}" stroke-width="2"><path d="M8 5v14l11-7z"/></svg><span style="font-size:13px; font-weight:600;">Playground</span></a>

  <div style="font-size:9.5px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#666; padding:14px 8px 8px;">Ajustes</div>
  <a href="{{ link }}" style="{{ styleConfig }}"><span style="{{ accentConfig }}"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ strokeConfig }}" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span style="font-size:13px; font-weight:600;">Configuração</span></a>
  <a href="{{ link }}" style="{{ styleConta }}"><span style="{{ accentConta }}"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ strokeConta }}" stroke-width="2"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span style="font-size:13px; font-weight:600;">Conta &amp; uso</span></a>

  <div style="margin-top:auto; background:#262626; border-radius:11px; padding:13px; display:flex; align-items:center; gap:11px;"><div style="width:40px; height:23px; border-radius:999px; background:#52cc5a; position:relative; flex-shrink:0;"><span style="position:absolute; top:2.5px; right:2.5px; width:18px; height:18px; border-radius:50%; background:#fff;"></span></div><div><div style="font-size:12px; font-weight:700; color:#fff;">SDR ativa</div><div style="font-size:10.5px; color:#8a8a8a;">atendendo 24/7</div></div></div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:228,&quot;height&quot;:560},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;conversas&quot;,&quot;leads&quot;,&quot;playground&quot;,&quot;config&quot;,&quot;conta&quot;],&quot;default&quot;:&quot;inicio&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;link&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'inicio';
    const link = this.props.link || '#';
    const base = 'display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:9px; text-decoration:none; position:relative; margin-bottom:3px;';
    const items = ['inicio','conversas','leads','playground','config','conta'];
    const out = { link };
    const cap = { inicio:'Inicio', conversas:'Conversas', leads:'Leads', playground:'Playground', config:'Config', conta:'Conta' };
    items.forEach(k => {
      const on = active === k;
      out['style' + cap[k]] = base + (on ? 'background:#262626; color:#fff;' : 'color:#b3b3b3;');
      out['accent' + cap[k]] = on ? 'position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:#e50914;' : 'display:none;';
      out['stroke' + cap[k]] = on ? '#fff' : '#b3b3b3';
    });
    return out;
  }
}
</script>
</body>
</html>
